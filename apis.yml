name: ArriVent Biopharma
description: 'ArriVent BioPharma (NASDAQ: AVBP) is a clinical-stage biopharmaceutical company dedicated
  to the identification, development, and commercialization of differentiated medicines for the treatment
  of cancer. Its lead candidate is firmonertinib, an EGFR inhibitor being studied across non-small cell
  lung cancer indications, and its pipeline includes next-generation antibody drug conjugates such as
  ARR-002. The company operates by identifying novel oncology programs, in-licensing drug candidates
  through partnerships, and designing regulatory-compliant clinical development strategies. It was surfaced
  as a portfolio company of HongShan and added to the API Evangelist network; as a traditional pharmaceutical
  developer it publishes no public API, developer portal, or technical integration surface.'
